metadata:
  version: '1'
  dependencies:
    apps:
    - id: dynatrace.davis.copilot.workflow.actions
      version: ^1.4.0-preview.6
    - id: dynatrace.email
      version: ^1.10.7
  inputs: []
workflow:
  title: Adoption Report AI Agent
  description: Agentic AI that generates a weekly adoption report for your application.
  schemaVersion: 4
  trigger:
    schedule:
      isActive: true
      trigger:
        time: 08:00
        type: time
      filterParameters:
        earliestStart: '2026-07-22'
      timezone: Europe/Vienna
      inputs: {}
  result: null
  type: STANDARD
  input: {}
  hourlyExecutionLimit: 1000
  guide: "# Workflow Guide: Adoption Report AI Agent\n\nThis workflow uses Dynatrace's\
    \ agentic AI to automatically generate a real-user adoption report for a monitored\
    \ application and deliver it by email — every Monday morning, no manual effort\
    \ required.\n\n---\n\n## Setup: Things You Must Adapt Before Importing\n\nBefore\
    \ activating this workflow, update two fields in the YAML to match your environment:\n\
    \n### 1. Application name in the AI prompt\n\nIn the `adoption_ai_report` task,\
    \ find the `prompt` field and replace every reference to `YOUR-APP-NAME` with the\
    \ name of your own application as it appears in Dynatrace:\n\n```yaml\nprompt:\
    \ 'Generate a markdown real-user adoption report for my **<YourApp>** frontend\n\
    \  application and give me a region breakdown of the top\n  10 adoption regions.\
    \ Also check last weeks **<YourApp>** stability where you\n  include all its downstream\
    \ dependencies. Summarize your\n  report in a maximum of 3000 words.'\n```\n\n\
    > Tip: The application name must match the entity name in Dynatrace so the AI\
    \ agent can look it up via DQL.\n\n### 2. Recipient email address\n\nIn the `send_ai_report`\
    \ task, replace the placeholder with your own address:\n\n```yaml\nto:\n  - your.email@example.com\n\
    ```\n\n---\n\n## Purpose\n\nThe workflow answers two recurring questions automatically\
    \ each morning:\n\n- **How is my application being adopted?** — real-user traffic\
    \ broken down by the top 10 geographic regions.\n- **How stable was my application\
    \ last week?** — a stability summary that includes all downstream service dependencies.\n\
    \nThe answers are compiled into a Markdown report by the AI agent and delivered\
    \ to your inbox before the workday starts.\n\n---\n\n## Trigger\n\nThe workflow\
    \ fires once every Monday morning. Adjust the `time` and `timezone` fields if\
    \ you need a different delivery window.\n\n---\n\n## Steps\n\nThe workflow contains\
    \ two sequential tasks.\n\n### Step 1 — `adoption_ai_report`: Generate the report\
    \ with AI\n\n**Action:** `dynatrace.davis.copilot.workflow.actions:agent-operator`\n\
    \nThis task invokes the Dynatrace Davis Copilot agent operator — an agentic AI\
    \ that can reason over your observability data and use tools to fetch live results.\n\
    \n**What the agent does:**\n\n1. Receives a natural-language prompt asking for:\n\
    \   - A real-user adoption report for the configured frontend application.\n \
    \  - A regional breakdown of the **top 10 adoption regions**.\n   - A **stability\
    \ check for the previous week**, covering the application and all its downstream\
    \ dependencies.\n   - A summary capped at **3000 words**.\n2. Uses the **`execute-dql`**\
    \ tool (via the `dynatrace-mcp` MCP gateway) to query Dynatrace data using DQL\
    \ — pulling real-user monitoring metrics, error rates, and service dependency\
    \ data.\n3. Returns the results as a **Markdown-formatted report**.\n\n**Key configuration:**\n\
    \n| Field | Value |\n|---|---|\n| `instruction` | Return a Markdown Report |\n\
    | `selectedTools` | `execute-dql` (DQL query execution via MCP) |\n| `selectedServers`\
    \ | `dynatrace-mcp` (MCP gateway) |\n\n---\n\n### Step 2 — `send_ai_report`: Deliver\
    \ the report by email\n\n**Action:** `dynatrace.email:send-email`\n\n**Runs only\
    \ when:** Step 1 (`adoption_ai_report`) completes with status `OK`.\n\nThis task\
    \ takes the Markdown text returned by the AI agent and sends it as an email.\n\
    \n**Email structure:**\n\n| Field | Value |\n|---|---|\n| Subject | `App Adoption\
    \ Report` |\n| Body | The full Markdown report generated by the AI agent (`{{\
    \ result(\"ai_adoption_report\")[\"text\"] }}`) |\n| To | Configured recipient\
    \ address |\n| CC / BCC | Empty by default — add as needed |\n\n---\n\n## Flow\
    \ Diagram\n\n```\n[Schedule Trigger: 08:00 daily]\n          │\n          ▼\n\
    ┌─────────────────────────┐\n│  adoption_ai_report     │\n│  Davis Copilot Agent\
    \    │\n│  → runs DQL queries     │\n│  → produces Markdown    │\n└─────────┬───────────────┘\n\
    \          │  on OK\n          ▼\n┌─────────────────────────┐\n│  send_ai_report\
    \         │\n│  Email Action           │\n│  → delivers report      │\n└─────────────────────────┘\n\
    ```\n\n---\n\n## Dependencies\n\n| App | Version | Purpose |\n|---|---|---|\n\
    | `dynatrace.davis.copilot.workflow.actions` | `^1.4.0-preview.6` | AI agent operator\
    \ task |\n| `dynatrace.email` | `^1.10.7` | Email delivery task |\n\nBoth apps\
    \ must be installed in your Dynatrace environment before the workflow can run."
  tasks:
    send_ai_report:
      name: send_ai_report
      input:
        cc: []
        to:
        - your.email@example.com
        bcc: []
        content: '# Application Adoption Report


          {{ result("ai_adoption_report")["text"] }}'
        subject: App Adoption Report
      action: dynatrace.email:send-email
      position:
        x: 0
        y: 2
      conditions:
        states:
          adoption_ai_report: OK
      description: Send email that delivers the AI agent generated adoption report
      predecessors:
      - adoption_ai_report
    adoption_ai_report:
      name: adoption_ai_report
      input:
        prompt: 'Generate a markdown real-user adoption report for my YOUR-APP-NAME frontend
          application and give me a region breakdown of the top

          10 adoption regions. Also check last weeks YOUR-APP-NAME stability where you
          include all its downstream dependencies. Summarize your

          report in a maximum of 3000 words.'
        instruction: '- Return a Markdown Report'
        outputFormat: ''
        selectedTools:
          execute-dql::3: true
        supplementary: ''
        conversationId: ''
        selectedServers:
        - name: dynatrace-mcp
          type: dtp-mcp-gateway
          tools:
          - execute-dql
      action: dynatrace.davis.copilot.workflow.actions:agent-operator
      position:
        x: 0
        y: 1
      description: Run Dynatrace Intelligence agentic AI to investigate the adoption
        of my app
      predecessors: []
